<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>启明一号 MAH 项目陪跑系统</title>
    <link rel="stylesheet" href="src/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">MAH 项目投资人全过程陪跑系统</p>
          <h1>启明一号 MAH 项目</h1>
        </div>
        <div class="topbar-actions">
          <span class="status-pill">草稿配置中</span>
          <button class="secondary-button" id="dashboard-button" type="button">查看驾驶舱</button>
          <button class="secondary-button" id="line-button" type="button">条线与岗位</button>
          <button class="secondary-button" id="capability-button" type="button">岗位能力评价</button>
          <button class="secondary-button" id="evidence-button" type="button">数据与证据</button>
          <button class="primary-button" type="button">保存草稿</button>
        </div>
      </header>

      <nav class="step-nav" id="setup-navigation" aria-label="项目初始化步骤">
        <ol>
          <li class="active"><button type="button" data-step="1"><span>01</span>投资方案</button></li>
          <li><button type="button" data-step="2"><span>02</span>里程碑</button></li>
          <li><button type="button" data-step="3"><span>03</span>阶段预算</button></li>
          <li><button type="button" data-step="4"><span>04</span>阶段组织</button></li>
          <li><button type="button" data-step="5"><span>05</span>岗位契约</button></li>
          <li><button type="button" data-step="6"><span>06</span>KPI 与数据源</button></li>
          <li><button type="button" data-step="7"><span>07</span>基线确认</button></li>
        </ol>
      </nav>

      <main class="workspace">
        <aside class="project-summary" aria-label="项目概要">
          <div class="summary-heading">
            <p>项目概要</p>
            <span>模拟数据</span>
          </div>
          <dl>
            <div><dt>投资总额</dt><dd>¥1.00 亿</dd></div>
            <div><dt>项目周期</dt><dd>36 个月</dd></div>
            <div><dt>当前阶段</dt><dd>M0 项目启动</dd></div>
            <div><dt>项目负责人</dt><dd>待指定</dd></div>
            <div><dt>PMO</dt><dd>待指定</dd></div>
          </dl>
          <section class="baseline-card">
            <p class="section-label">基线状态</p>
            <strong>尚未确认</strong>
            <p>完成七步配置后，锁定项目、财务、组织和绩效基线。</p>
          </section>
        </aside>

        <section class="content-panel" aria-labelledby="panel-title">
          <div class="panel-header">
            <div>
              <p class="eyebrow">步骤 01 / 07</p>
              <h2 id="panel-title">投资方案</h2>
              <p>定义项目基本信息、投资目标和治理角色，为后续里程碑与基线配置建立起点。</p>
            </div>
            <span class="completion">0% 已完成</span>
          </div>

          <form id="setup-form" novalidate></form>
          <div class="panel-actions">
            <button class="secondary-button" id="previous-step" type="button">上一步</button>
            <button class="primary-button" id="next-step" type="button">保存并继续</button>
          </div>
        </section>
      </main>
    </div>
    <script src="src/app.js"></script>
  </body>
</html>
